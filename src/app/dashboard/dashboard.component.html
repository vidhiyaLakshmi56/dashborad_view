
<div class="dashboard-container">
    <!-- Header -->
    <header class="header">
      <h2>Dashboard</h2>
      <p class="subtitle">Quick overview of your app’s key metrics</p>
    </header>
  
    <!-- KPI Cards -->
    <section class="card-row" aria-label="Key metrics">
      <div class="card" *ngFor="let kpi of kpis">
        <h3 class="card-title">{{ kpi.title }}</h3>
        <p class="card-value">{{ kpi.value }}</p>
      </div>
    </section>
  
    <!-- Recent Activities Table -->
    <section class="table-section">
      <h3>Recent Activities Allowed</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Activity</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of activities">
              <td>{{ item.id }}</td>
              <td>{{ item.activity }}</td>
              <td>
                <span
                  class="status"
                  [class.success]="item.status === 'Success' || item.status === 'Completed'"
                  [class.pending]="item.status === 'Pending'"
                >
                  {{ item.status }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
